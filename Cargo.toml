[package]
name = "mdnsd"
version = "0.1.0"
edition = "2024"
description = "mDNS discovery and per-segment reflection daemon, with the mdnsctl client"
license = "GPL-3.0-only"

default-run = "mdnsd"

[[bin]]
name = "mdnsctl"
path = "src/ipc_client.rs"

[dependencies]
anyhow = "1.0.104"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
libc = "0.2.191"
rustix = { version = "1.1.6", default-features = false, features = ["alloc", "fs", "net", "pipe", "process", "stdio", "time"] }
# Without std, for mdnsctl: alloc is all it needs, preserve_order included.
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "preserve_order"] }

# Small enough for a router's flash: no symbols, whole-program optimisation,
# and optimised for size, which costs nothing at mDNS's packet rates. A panic
# aborts the daemon rather than unwinding one thread of it; systemd restarts it.
# mdnsctl has no std to unwind with: a panic aborts, in debug builds too.
# Tests unwind whatever this says.
[profile.dev]
panic = "abort"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
