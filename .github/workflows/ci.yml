name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# What is built once, and what every other job runs: the daemon (with a socket
# for each interface, and with one shared by every interface, as the BSDs have
# them), mdnsctl and the unit tests' executables, built to record what they
# run. What a profile of coverage says is about the binary that wrote it, so the
# jobs that run them and the one that reports on them use these and none of
# their own.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The crate uses edition 2024, so it needs a recent toolchain.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # --locked fails if Cargo.lock is out of date, so a dependency change
      # that was not committed with its lock file is caught here.
      - name: Build
        run: python3 e2e/coverage.py build --out binaries

      - name: Keep the binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: binaries
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries

      - name: Test
        run: python3 e2e/coverage.py unit --binaries binaries --out profile-unit

      - name: Keep the profile
        uses: actions/upload-artifact@v4
        with:
          name: profile-unit
          path: profile-unit
          retention-days: 1

  # The built daemon, run through what the unit tests cannot: interfaces that
  # come and go, real sockets, signals, the control and avahi sockets. See e2e/.
  # Once for each form of the sockets: Linux pins one to each interface, and the
  # BSDs share one between them, which is run here as `portable`.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sockets: [pinned, portable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries

      # The harness makes its own user and network namespaces. Recent Ubuntu
      # forbids unprivileged user namespaces unless AppArmor is told not to;
      # where that does not work, the harness is run as root, which makes only
      # a network namespace.
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe veth || true

      - name: End-to-end tests
        run: python3 e2e/coverage.py e2e --binaries binaries --sockets ${{ matrix.sockets }} --out profile-e2e --logs e2e-logs

      - name: Keep the daemon's logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.sockets }}
          path: e2e-logs
          retention-days: 7

      - name: Keep the profile
        uses: actions/upload-artifact@v4
        with:
          name: profile-e2e-${{ matrix.sockets }}
          path: profile-e2e
          retention-days: 1

  # What the unit tests and the end-to-end tests cover together, as a table in
  # the job's summary and, on a pull request, a comment that says how it moved
  # from master. The tests are not run again: this merges what they recorded.
  # The report by line is kept as an artifact.
  coverage:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # The source is read from where it was when it was built, which is here.
      - uses: actions/checkout@v4

      # The LLVM tools of the compiler read what it wrote.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries

      # Each profile in a folder of its own, by the name it was kept under.
      - uses: actions/download-artifact@v4
        with:
          pattern: profile-*
          path: profiles

      # What master last measured, to say how this moved. Best effort: with none,
      # the table is of this alone.
      - name: Fetch the coverage of master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch master \
                --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-summary --dir baseline || true
          fi
          ls baseline

      - name: Report
        run: |
          python3 e2e/coverage.py report --binaries binaries \
            --profiles profiles/* --out coverage-report \
            $( [ -f baseline/summary.json ] && echo --baseline baseline/summary.json )

      # master's figures are what the next pull request is compared with.
      - name: Keep the figures
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-report/summary.json

      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report/html
            coverage-report/lcov.info
            coverage-report/summary.md

      # One comment, kept up to date, and only where the token may write: not
      # on a pull request from a fork.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            const body = marker + '\n' + fs.readFileSync('coverage-report/summary.md', 'utf8') +
              `\n[The report, line by line](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) (artifact \`coverage-report\`).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The daemon on FreeBSD, in a virtual machine, which is what pfSense and OPNsense
  # are: its unit tests, and the end-to-end tests, where the router is a VNET jail
  # and the links epair interfaces (see e2e/). They are run as root, and change the
  # network of the machine, which is why it is a virtual machine. It builds in the
  # machine, and not from the build job's binaries, which are for Linux; so it
  # records no coverage. What is built there is not synchronised back, so it is all
  # one step. The action is pinned by its commit, as it is not GitHub's.
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: cpa.sh {0} --sync-files runner-to-vm
    strategy:
      fail-fast: false
      matrix:
        version: ['14.5', '15.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start the virtual machine
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: ${{ matrix.version }}
          architecture: x86_64

      - name: Build, and run the unit tests and the end-to-end tests
        run: |
          set -eux
          freebsd-version
          sudo pkg install -y rust python3
          rustc --version
          cargo test --locked
          # Last, and with the clock the end-to-end tests move: without it they
          # skip what needs it, and still pass.
          cargo build --locked --features test-clock
          strings target/debug/mdnsd | grep -q 'advance <milliseconds>'
          sudo python3 e2e/e2e.py --ctl target/debug/mdnsctl target/debug/mdnsd
