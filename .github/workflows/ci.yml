name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The crate uses edition 2024, so it needs a recent toolchain.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # --locked fails if Cargo.lock is out of date, so a dependency change
      # that was not committed with its lock file is caught here.
      - name: Test
        run: cargo test --locked
